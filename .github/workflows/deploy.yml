name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest and redeploy container
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'EOF'
            set -euo pipefail

            cd /opt/moddrum/moddrum-marketing
            git pull
            docker network inspect moddrum_moddrum-network > /dev/null 2>&1 || docker network create moddrum_moddrum-network > /dev/null
            docker stop moddrum-marketing 2>/dev/null || true
            docker rm moddrum-marketing 2>/dev/null || true
            docker build -t moddrum-marketing .
            docker run -d \
              --name moddrum-marketing \
              --network moddrum_moddrum-network \
              --network-alias marketing \
              --restart unless-stopped \
              moddrum-marketing
            docker inspect moddrum-marketing --format '{{.State.Running}}' | grep -qx 'true'
            docker inspect moddrum-marketing --format '{{json .NetworkSettings.Networks}}' | grep -q 'moddrum_moddrum-network'
            curl --fail --silent --show-error --max-time 10 -H 'Host: moddrum.com' http://127.0.0.1/ > /dev/null
          EOF
